<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify Karaoke</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>Spotify Karaoke</h1>
    </header>

    <section aria-labelledby="mode-label">
      <h2 id="mode-label">Main line</h2>
      <div class="seg" role="radiogroup" aria-labelledby="mode-label">
        <label><input type="radio" name="mode" value="original" /><span>Original</span></label>
        <label><input type="radio" name="mode" value="romanized" /><span>Romanized</span></label>
        <label><input type="radio" name="mode" value="translated" /><span>Translated</span></label>
      </div>
      <p class="hint">Keys while lyrics are open: <kbd>O</kbd> <kbd>R</kbd> <kbd>T</kbd></p>
    </section>

    <section>
      <h2>Also show beneath</h2>
      <label class="row"><input type="checkbox" name="showOriginal" /> Original lyrics</label>
      <label class="row"><input type="checkbox" name="showRomanized" /> Romanization</label>
      <label class="row"><input type="checkbox" name="showTranslation" /> Translation</label>
    </section>

    <section>
      <h2><label for="lang-search">Translate into</label></h2>
      <input id="lang-search" type="search" placeholder="Search languages" autocomplete="off" aria-controls="lang" />
      <select id="lang" name="targetLang" size="5" aria-label="Translate into"></select>
    </section>

    <section>
      <h2>More</h2>
      <label class="row"><input type="checkbox" name="fillMissing" /> Find lyrics when Spotify has none</label>
      <label class="row"><input type="checkbox" name="restoreNative" /> Restore the original script</label>
      <label class="row"><input type="checkbox" name="showPill" /> Show the switcher on the lyrics</label>
    </section>

    <section>
      <h2>Status</h2>
      <ul id="status" class="status" aria-live="polite"></ul>
      <div class="cache">
        <span id="cache-size">Cache: …</span>
        <button id="clear" type="button">Clear cache</button>
      </div>
    </section>

    <footer>
      <span id="version"></span>
      <a href="#" id="shortcuts">Keyboard shortcuts</a>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
